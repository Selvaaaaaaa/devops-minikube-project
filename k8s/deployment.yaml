apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-flask

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-flask

  template:
    metadata:
      labels:
        app: devops-flask

    spec:
      containers:
        - name: devops-flask
          image: localhost:5000/devops-flask-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000
